<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CommuteMatch - Cài đặt">
  <title>Cài đặt | CommuteMatch</title>
  <link rel="stylesheet" href="css/settings.css">
</head>

<body data-page="settings">

  <div class="dai-shell">

    <!-- ===== Thanh trên cùng ===== -->
    <header class="dai-bar">
      <a class="dai-brand" href="../HIEU/index.html">
        <span class="dai-brand-mark">CM</span>
        <span class="dai-brand-name">CommuteMatch</span>
      </a>

      <nav class="dai-nav" id="mainNav">
        <a class="nav-link" href="rider-trip-search.html">Tìm chuyến</a>
        <a class="nav-link" href="rider-match-results.html">Gợi ý phù hợp</a>
        <a class="nav-link" href="rider-my-trips.html">Chuyến của tôi</a>
      </nav>

      <div class="dai-tools">
        <a class="dai-tool" href="notifications.html" title="Thông báo">3</a>
        <a class="dai-tool dai-avatar" href="profile.html" title="Hồ sơ">HA</a>
        <button class="dai-tool dai-menu" data-action="menu" aria-label="Mở menu">≡</button>
      </div>
    </header>

    <main class="dai-main">

      <!-- ===== Tiêu đề trang ===== -->
      <div class="dai-head">
        <div>
          <div class="dai-kicker">Tài khoản</div>
          <h1>Cài đặt</h1>
          <p class="dai-note">Tùy chỉnh bảo mật, thông báo và giao diện.</p>
        </div>
      </div>

      <div class="dai-hai-cot">

        <!-- ===== Đổi mật khẩu ===== -->
        <section class="dai-panel">
          <h2>Đổi mật khẩu</h2>
          <form class="dai-form" style="margin-top:16px" onsubmit="return false">
            <div class="dai-field">
              <label for="stMatKhauCu">Mật khẩu hiện tại</label>
              <input class="dai-input" id="stMatKhauCu" type="password" value="12345678" placeholder="Mật khẩu hiện tại">
            </div>
            <div class="dai-field">
              <label for="stMatKhauMoi">Mật khẩu mới</label>
              <input class="dai-input" id="stMatKhauMoi" type="password" value="" placeholder="Mật khẩu mới">
            </div>
            <div class="dai-field">
              <label for="stXacNhan">Xác nhận mật khẩu</label>
              <input class="dai-input" id="stXacNhan" type="password" value="" placeholder="Xác nhận mật khẩu">
            </div>
            <div class="dai-btn-row" style="flex:1 1 100%">
              <button class="dai-btn dai-btn-main" data-action="save">Cập nhật mật khẩu</button>
            </div>
          </form>
        </section>

        <!-- ===== Thông báo ===== -->
        <section class="dai-panel">
          <h2>Thông báo</h2>
          <div class="dai-list" style="margin-top:16px">
            <label class="dai-item">
              <span class="dai-item-body">
                <strong>Yêu cầu tham gia</strong>
                <p>Khi có người gửi hoặc phản hồi yêu cầu.</p>
              </span>
              <input type="checkbox" checked>
            </label>
            <label class="dai-item">
              <span class="dai-item-body">
                <strong>Nhắc lịch chuyến</strong>
                <p>Trước giờ khởi hành 30 phút.</p>
              </span>
              <input type="checkbox" checked>
            </label>
            <label class="dai-item">
              <span class="dai-item-body">
                <strong>Tin cộng đồng</strong>
                <p>Cập nhật và mẹo sử dụng.</p>
              </span>
              <input type="checkbox">
            </label>
          </div>
        </section>

        <!-- ===== Phiên đăng nhập ===== -->
        <section class="dai-panel">
          <h2>Phiên đăng nhập</h2>
          <p class="dai-note">Chrome trên Windows · Hà Nội · Đang hoạt động</p>
          <div class="dai-btn-row">
            <button class="dai-btn dai-btn-bad" data-action="logout">Đăng xuất</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">Đã cập nhật thành công</div>

  <script src="js/duong-dan.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
