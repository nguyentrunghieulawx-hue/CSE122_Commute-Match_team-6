<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CommuteMatch - Tìm chuyến">
  <title>Tìm chuyến | CommuteMatch</title>
  <link rel="stylesheet" href="css/rider-trip-search.css">
</head>

<body data-page="rider-trip-search">

  <div class="dai-shell">

    <!-- ===== Thanh trên cùng ===== -->
    <header class="dai-bar">
      <a class="dai-brand" href="https://nguyentrunghieulawx-hue.github.io/CSE122_Commute-Match_team-6/HIEU/index.html">
        <span class="dai-brand-mark">CM</span>
        <span class="dai-brand-name">CommuteMatch</span>
      </a>

      <nav class="dai-nav" id="mainNav">
        <a class="nav-link active" href="rider-trip-search.html">Tìm chuyến</a>
        <a class="nav-link" href="rider-match-results.html">Gợi ý phù hợp</a>
        <a class="nav-link" href="rider-my-trips.html">Chuyến của tôi</a>
      </nav>

      <div class="dai-tools">
        <a class="dai-tool" href="notifications.html" title="Thông báo">3</a>
        <a class="dai-tool dai-avatar" href="profile.html" title="Hồ sơ">HA</a>
        <button class="dai-tool dai-menu" data-action="menu" aria-label="Mở menu">≡</button>
      </div>
    </header>

    <main class="dai-main">

      <!-- ===== Tiêu đề trang ===== -->
      <div class="dai-head">
        <div>
          <div class="dai-kicker">Hành khách</div>
          <h1>Bạn muốn đi đâu?</h1>
          <p class="dai-note">Nhập hành trình để AI tìm chuyến phù hợp nhất.</p>
        </div>
      </div>

      <div class="dai-flex">

        <!-- ===== Cột chính: form tìm chuyến ===== -->
        <div class="dai-col-main">
          <section class="dai-panel">
            <form class="dai-form" onsubmit="return false">
              <div class="dai-field">
                <label for="tsDiemDi">Điểm đi</label>
                <input class="dai-input" id="tsDiemDi" type="text" value="Cầu Giấy, Hà Nội" placeholder="Điểm đi">
              </div>
              <div class="dai-field">
                <label for="tsDiemDen">Điểm đến</label>
                <input class="dai-input" id="tsDiemDen" type="text" value="Khu CNC Hòa Lạc" placeholder="Điểm đến">
              </div>
              <div class="dai-field">
                <label for="tsNgayDi">Ngày đi</label>
                <input class="dai-input" id="tsNgayDi" type="date" value="2026-10-05">
              </div>
              <div class="dai-field">
                <label for="tsGio">Giờ mong muốn</label>
                <input class="dai-input" id="tsGio" type="time" value="07:15">
              </div>
              <div class="dai-field">
                <label for="tsSoCho">Số chỗ</label>
                <select class="dai-select" id="tsSoCho">
                  <option>1 chỗ</option>
                  <option>2 chỗ</option>
                  <option>3 chỗ</option>
                </select>
              </div>
              <div class="dai-field">
                <label for="tsBanKinh">Bán kính điểm đón</label>
                <select class="dai-select" id="tsBanKinh">
                  <option>Trong 500m</option>
                  <option>Trong 1km</option>
                  <option>Trong 2km</option>
                </select>
              </div>
            </form>

            <div class="dai-btn-row">
              <button class="dai-btn dai-btn-amber" data-action="search">Tìm chuyến phù hợp</button>
            </div>
          </section>
        </div>

        <!-- ===== Cột phụ: tìm gần đây ===== -->
        <div class="dai-col-side">
          <section class="dai-panel">
            <div class="dai-panel-head">
              <h2>Tìm gần đây</h2>
              <button class="dai-btn dai-btn-line dai-btn-sm">Xóa</button>
            </div>

            <div class="dai-list">
              <a class="dai-item" href="rider-match-results.html">
                <div class="dai-item-body">
                  <strong>Cầu Giấy → Hòa Lạc</strong>
                  <p>Thứ Hai · 07:00–08:00</p>
                </div>
                <span class="dai-score">→</span>
              </a>
              <a class="dai-item" href="rider-match-results.html">
                <div class="dai-item-body">
                  <strong>Hà Đông → ĐHQG</strong>
                  <p>Thứ Sáu · 07:30</p>
                </div>
                <span class="dai-score">→</span>
              </a>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">Đã cập nhật thành công</div>

  <script src="js/duong-dan.js"></script>
  <script src="js/rider-trip-search.js"></script>
</body>
</html>
